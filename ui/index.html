<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALC — Learn how a programming language works</title>
  <meta name="description" content="Learn the CALC programming language with interactive lessons, a live playground, and a look inside the interpreter.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    (function () {
      try {
        var theme = JSON.parse(localStorage.getItem('calc.theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) { /* no saved theme */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="CALC home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor"/>
          <path d="M8 11l5 5-5 5M16 21h8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">CALC</span>
        <span class="brand-sub">learn</span>
      </a>
      <nav class="mainnav" aria-label="Main">
        <a href="#/learn" data-nav="learn">Tutorial</a>
        <a href="#/playground" data-nav="playground">Playground</a>
        <a href="#/reference" data-nav="reference">Reference</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <noscript><p class="page">This site needs JavaScript to run CALC code.</p></noscript>

  <script src="editor.js"></script>
  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
